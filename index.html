<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Veloz Acompanha: acompanhamento e aprovação digital de serviços da Auto Center Veloz.">
  <meta name="author" content="Ricardo Medeiros">
  <meta name="theme-color" content="#0f172a">
  <title>Veloz Acompanha | Auto Center Veloz</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    /* Aplica o tema salvo antes da pintura, para não piscar. */
    try { var t = localStorage.getItem('veloz:tema'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true">V</span>
      <span class="brand-text"><strong>Auto Center Veloz</strong><small>Veloz Acompanha</small></span>
    </a>
    <div class="topbar-right">
      <nav class="nav" aria-label="Perfis">
        <a href="#/cliente" data-nav="cliente">Cliente</a>
        <a href="#/mecanico" data-nav="mecanico">Mecânico</a>
        <a href="#/recepcao" data-nav="recepcao">Recepção</a>
        <a href="#/desenvolvedor" data-nav="desenvolvedor">Desenvolvedor</a>
      </nav>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Alternar tema claro/escuro" title="Alternar tema">◐</button>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="footer">
    <span>Protótipo acadêmico · dados fictícios salvos só neste navegador · feito por <a href="#/desenvolvedor">Ricardo Medeiros</a></span>
    <button class="link-btn" id="reset-demo" type="button">Restaurar dados de exemplo</button>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
  <script src="js/data.js"></script>
  <script src="js/dev.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  </script>
</body>
</html>
